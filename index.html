<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamar o TI</title>
<style>
  :root { --azul:#1f4e78; --verde:#1e8e4e; --vermelho:#c0392b; --fundo:#f4f6f9; --texto:#1c1c1c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--fundo); color:var(--texto);
         font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding:24px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:20px; padding:32px 24px;
          text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .sala { font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:#666; margin:0; }
  h1 { font-size:40px; margin:4px 0 24px; color:var(--azul); }
  button { width:100%; border:0; border-radius:16px; padding:28px 16px; font-size:24px; font-weight:700;
           color:#fff; background:var(--azul); cursor:pointer; transition:transform .1s, opacity .2s; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.6; cursor:default; }
  .icone { font-size:72px; line-height:1; margin:8px 0 12px; }
  .msg { font-size:20px; font-weight:700; margin:0 0 8px; }
  .sub { font-size:16px; color:#555; margin:0; }
  .ok .msg { color:var(--verde); }
  .erro .msg { color:var(--vermelho); }
  .oculto { display:none; }
  .rodape { margin-top:24px; font-size:13px; color:#999; }
</style>
</head>
<body>
<main class="card">
  <p class="sala">Tecnologia da escola</p>
  <h1 id="nomeSala">Sala</h1>

  <div id="telaInicial">
    <button id="botao" type="button">🔔 Chamar o TI</button>
    <p class="rodape">Aperte o botão e o técnico recebe o aviso na hora.</p>
  </div>

  <div id="telaOk" class="ok oculto">
    <div class="icone">✅</div>
    <p class="msg">O TI foi avisado!</p>
    <p class="sub">Já estamos indo até a <span class="nomeSalaTxt"></span>.<br>Pode fechar esta página.</p>
  </div>

  <div id="telaErro" class="erro oculto">
    <div class="icone">⚠️</div>
    <p class="msg">Não foi possível chamar.</p>
    <p class="sub">Verifique a internet e tente de novo, ou procure o TI pessoalmente.</p>
    <p class="rodape"><button id="tentarDeNovo" type="button" style="padding:16px;font-size:18px">Tentar de novo</button></p>
  </div>
</main>

<script>
  // ====== CONFIGURAÇÃO ======
  // Tópico do ntfy em que o seu celular está inscrito.
  // Troque por um nome único e difícil de adivinhar, e use o mesmo tópico para todas as salas.
  const TOPICO = "chamados-aparecido-batista";
  // Intervalo mínimo entre dois chamados da mesma sala neste celular (evita chamar várias vezes sem querer)
  const ESPERA_SEGUNDOS = 60;
  // ==========================

  const params = new URLSearchParams(location.search);
  const sala = (params.get("sala") || "").trim().slice(0, 30) || "sala não informada";
  const nome = /^\d+$/.test(sala) ? "Sala " + sala : sala;

  document.getElementById("nomeSala").textContent = nome;
  document.querySelectorAll(".nomeSalaTxt").forEach(e => e.textContent = nome);
  document.title = "Chamar o TI – " + nome;

  const mostrar = id => ["telaInicial", "telaOk", "telaErro"].forEach(t =>
    document.getElementById(t).classList.toggle("oculto", t !== id));

  const chave = "ultimoChamado_" + sala;
  function chamadoRecente() {
    try { return Date.now() - Number(localStorage.getItem(chave) || 0) < ESPERA_SEGUNDOS * 1000; }
    catch (e) { return false; }
  }

  async function chamar() {
    const botao = document.getElementById("botao");
    if (chamadoRecente()) { mostrar("telaOk"); return; }
    botao.disabled = true;
    botao.textContent = "Chamando...";
    try {
      // Corpo em JSON sem cabeçalhos extras: requisição simples, sem bloqueio de CORS
      const resp = await fetch("https://ntfy.sh/", {
        method: "POST",
        body: JSON.stringify({
          topic: TOPICO,
          title: "Chamado TI",
          message: nome + " chamando",
          tags: ["bell"],
          priority: 4
        })
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      try { localStorage.setItem(chave, String(Date.now())); } catch (e) {}
      mostrar("telaOk");
    } catch (e) {
      mostrar("telaErro");
    } finally {
      botao.disabled = false;
      botao.textContent = "🔔 Chamar o TI";
    }
  }

  document.getElementById("botao").addEventListener("click", chamar);
  document.getElementById("tentarDeNovo").addEventListener("click", () => { mostrar("telaInicial"); chamar(); });
</script>
</body>
</html>
